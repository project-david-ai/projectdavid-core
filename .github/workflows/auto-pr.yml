
name: Core Auto PR

on:
  workflow_run:
    workflows:
      - 'Lint, Test, Build, and Publish Docker Images'
    types:
      - completed
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: core-auto-pr-dev-to-main
  cancel-in-progress: false

jobs:
  create-pr:
    name: Propose verified dev commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Verify tested SHA is current and ahead of main
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          current_sha="$(gh api "repos/$GH_REPO/git/ref/heads/dev" --jq '.object.sha')"

          if [[ "$current_sha" != "$TESTED_SHA" ]]; then
            echo "Stale CI run; a newer dev commit must pass CI"
            exit 0
          fi

          ahead="$(gh api "repos/$GH_REPO/compare/main...dev" --jq '.ahead_by')"

          if [[ "$ahead" -eq 0 ]]; then
            echo 'No dev commits to promote'
            exit 0
          fi

          echo 'eligible=true' >> "$GITHUB_OUTPUT"

      - name: Mint limited GitHub App token
        if: steps.verify.outputs.eligible == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: 5843240
          private-key: ${{ secrets.AUTO_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: projectdavid-core
          permission-contents: read
          permission-pull-requests: write

      - name: Create or reuse the dev to main PR
        if: steps.verify.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          existing="$(gh pr list --repo "$GH_REPO" --base main --head dev --state open --json number --jq '.[0].number // ""')"

          if [[ -n "$existing" ]]; then
            echo "Existing dev to main PR #$existing will track new commits"
            exit 0
          fi

          gh pr create \
            --repo "$GH_REPO" \
            --base main \
            --head dev \
            --title 'Promote dev to main' \
            --body 'Automated from successful Core dev CI. Review checks and merge manually. No automatic merge or production release.'
